server:
  port: 8000
  servlet:
    session:
      # 卖家 30 分钟无操作后需要重新登录
      timeout: 30m
      cookie:
        # 页面脚本读不到登录 Cookie；其他网站发起的跨站请求不带这个 Cookie
        http-only: true
        same-site: lax
  tomcat:
    # 上传超过大小上限时，Tomcat 要先读完请求体才能把错误提示返回给浏览器；默认只读 2MB，超过就直接断开连接
    max-swallow-size: 20MB

spring:
  application:
    name: onlineshop-backend
  servlet:
    multipart:
      # 商品图片单张不超过 5MB（US-27），超过时返回 400「图片不能超过 5MB」
      max-file-size: 5MB
      max-request-size: 6MB
  datasource:
    # 数据库连接通过环境变量 DB_URL / DB_USERNAME / DB_PASSWORD 配置，不设置时使用下面的默认值。
    # createDatabaseIfNotExist=true：库不存在时自动创建。
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/onlineshop?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  flyway:
    # 启动时按版本执行 db/migration 下的建表、改表脚本
    locations: classpath:db/migration
    # 脚本里有中文注释和 COMMENT，按 UTF-8 读取，不受系统默认编码影响
    encoding: UTF-8
    # 库里已经有表、但还没有 Flyway 记录时，以版本 0 为基线继续执行全部脚本；
    # V1 用 IF NOT EXISTS，已有的表和数据都会保留
    baseline-on-migrate: true
    baseline-version: 0

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto

shop:
  cors:
    # 允许跨域访问后端的前端地址；开发时前端走 Vite 代理，不经过跨域
    allowed-origins:
      - http://localhost:5173
      - http://127.0.0.1:5173
  default-seller:
    # 卖家表为空时自动创建的初始账号
    username: admin
    password: "123456"
  upload:
    # 商品图片的保存目录，可用环境变量 UPLOAD_DIR 指定；Docker 部署时要挂载成数据卷，否则重建容器后图片丢失
    dir: ${UPLOAD_DIR:uploads}

logging:
  level:
    com.onlineshop: info
    # 打印执行的 SQL
    com.onlineshop.mapper: debug
