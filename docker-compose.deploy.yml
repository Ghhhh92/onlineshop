# 在线购物系统 · 离线部署（无需源码、无需构建、无需网络）
#
# 前置：先导入镜像包
#   docker load -i onlineshop-images.tar
# 启动：一条命令
#   docker compose -f docker-compose.deploy.yml up -d
# 访问：
#   前端 http://localhost:8080
#   卖家后台 http://localhost:8080/seller/login（admin / 123456）
#
# 与 docker-compose.yml 的区别：这里直接用已构建好的镜像（image:），不重新构建，
# 因此不需要源码、也不需要联网下载 npm / Maven 依赖，适合离线环境（如机房演示）。
name: onlineshop

services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: onlineshop
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - db-data:/var/lib/mysql
    ports:
      # 映射到 13306，避免与宿主机已有的 MySQL（3306）冲突；容器间仍用 db:3306 访问
      - "13306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    image: onlineshop-backend:1.0.0
    environment:
      DB_URL: "jdbc:mysql://db:3306/onlineshop?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false"
      DB_USERNAME: root
      DB_PASSWORD: root
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    image: onlineshop-frontend:1.0.0
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  db-data:
